spring.application.name=saude-mental-api
api.version=1.0.0
api.current-version=v1

server.port=8080
server.servlet.context-path=/

spring.data.mongodb.uri=mongodb://admin:password123@localhost:27017/saude_mental?authSource=admin
spring.data.mongodb.auto-index-creation=true

jwt.secret=sua-chave-secreta-muito-segura-aqui-com-pelo-menos-256-bits-de-entropia
jwt.expiration=86400000

audit.retention-days=2555
audit.enabled=true

logging.level.root=INFO
logging.level.com.saudemental.api=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

api.versioning.enabled=true
api.versioning.default-version=v1
api.versioning.header-name=X-API-Version
api.versioning.deprecation-warning=true

api.versions.available=v1
api.versions.deprecated=
api.versions.sunset=

api.v1.status=STABLE
api.v1.release-date=2024-01-01
api.v1.deprecation-date=
api.v1.sunset-date=

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

springdoc.api-docs.groups.enabled=true
springdoc.group-configs[0].group=v1
springdoc.group-configs[0].paths-to-match=/api/v1/**
springdoc.group-configs[0].display-name=API v1

spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.version=${api.version}

data.retention.assessment-years=7
data.retention.mood-years=7
data.retention.audit-years=7
data.retention.user-inactive-days=730